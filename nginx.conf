worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 0.0.0.0:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Pages and generated patches must never be served from a browser/CDN cache.
    # Put this before the generic asset rule: nginx uses the first matching regex.
    location ~ ^/(index\.html|map-editor\.html|js/(MapEdits|CommunityAssets|MapEditor)\.js)$ {
      expires -1;
      add_header Cache-Control "no-store, must-revalidate";
      try_files $uri =404;
    }

    location ~* \.(mp3|m4a|ogg|wav|webm|mp4|glb|png|jpe?g|gif|svg|webp|js|css|json|md)$ {
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri =404;
    }
  }
}
