<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>THE HARBOR — PSX Intro Cutscene</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #120b18; overflow: hidden;
  }
  /* The WebGL canvas is rendered at 320x240 and blown up with nearest-neighbour
     scaling so every pixel stays crisp, exactly like a PlayStation output. */
  #screen, #fpvHud {
    position: absolute; inset: 0;
    width: 100vw; height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
  }
  #fpvHud { pointer-events: none; }
  #title {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
    font-family: "Courier New", monospace;
    text-align: center;
    transition: none; /* opacity is driven by the cutscene clock */
  }
  #title h1 {
    margin: 0;
    font-size: clamp(24px, 9vw, 92px);
    letter-spacing: 0.22em;
    font-weight: 900;
    color: #ffdca0;
    text-shadow:
      0 0 2px #fff3d0,
      3px 3px 0 #7a2b4e,
      6px 6px 0 #35172c;
    transform: translateX(0.11em); /* balance the letter-spacing */
  }
  #title p {
    margin: 1.2em 0 0;
    font-size: clamp(10px, 2.4vw, 20px);
    letter-spacing: 0.5em;
    color: #f0ae7a;
    text-shadow: 2px 2px 0 #3a1626;
    transform: translateX(0.25em);
  }
  #hint {
    position: absolute; left: 8px; bottom: 6px;
    font: 11px "Courier New", monospace;
    color: rgba(255, 220, 160, 0.55);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="screen" width="320" height="240"></canvas>
<canvas id="fpvHud" width="320" height="240"></canvas>
<div id="title"><h1>THE HARBOR</h1><p>NORTH CAROLINA · 1998</p></div>
<div id="hint">Click or press any key to replay</div>

<!-- Vendored Three.js: keeps the cutscene fully offline, no CDN/network. -->
<script src="js/vendor/three.min.js"></script>
<script>
(function () {
'use strict';

/* =========================================================================
   0. CONSTANTS & DOM
   ========================================================================= */
var W = 320, H = 240;                 // native PSX-ish framebuffer
var CLIP_DURATION = 16.0;             // seconds, three acts
var canvas = document.getElementById('screen');
var hudCanvas = document.getElementById('fpvHud');
var hudCtx = hudCanvas.getContext('2d');
hudCtx.imageSmoothingEnabled = false;
var titleEl = document.getElementById('title');

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false,
                                         powerPreference: 'low-power' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x2a1830, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = false;   // PS1 had none — blob shadows only

/* =========================================================================
   1. PSX MATERIAL PATCH
   -------------------------------------------------------------------------
   onBeforeCompile injects two things into every lit/unlit material:
     * vertex snapping: clip-space XY is quantized to a coarse grid, the
       signature PS1 polygon "wobble" as geometry moves across the screen.
     * affine UVs: perspective-correct varyings are deliberately defeated so
       textures swim/shear across large polygons (no perspective divide).
   ========================================================================= */
var PSX_GRID = 160.0;   // lower = chunkier snapping (160 steps across clip space)

function patchPSX(material, opts) {
  opts = opts || {};
  material.onBeforeCompile = function (shader) {
    shader.uniforms.uSnap = { value: opts.snap == null ? 1 : (opts.snap ? 1 : 0) };
    shader.uniforms.uGrid = { value: opts.grid || PSX_GRID };

    /* --- vertex shader ------------------------------------------------- */
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', [
        '#include <common>',
        'uniform float uSnap;',
        'uniform float uGrid;',
        'varying vec2 vAffineUV;',
        'varying float vAffineW;'
      ].join('\n'))
      // Three.js writes the final clip position in <project_vertex>. Snap it.
      .replace('#include <project_vertex>', [
        '#include <project_vertex>',
        'if (uSnap > 0.5) {',
        '  gl_Position.xy = floor(gl_Position.xy * uGrid + 0.5) / uGrid;',
        '}'
      ].join('\n'))
      // Compute affine UV companions AFTER <project_vertex> (where
      // gl_Position finally exists). vAffineUV = mappedUV * w and
      // vAffineW = w; perspective-correct interpolation of both gives a pure
      // screen-space (non-perspective) UV when the fragment divides them.
      .replace('#include <project_vertex>', [
        '#include <project_vertex>',
        '#ifdef USE_MAP',
        '  vAffineW = gl_Position.w;',
        '  vAffineUV = ( mapTransform * vec3( MAP_UV, 1.0 ) ).xy * vAffineW;',
        '#else',
        '  vAffineW = 1.0;',
        '  vAffineUV = vec2( 0.0 );',
        '#endif'
      ].join('\n'));

    /* --- fragment shader ----------------------------------------------- */
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', [
        '#include <common>',
        'varying vec2 vAffineUV;',
        'varying float vAffineW;'
      ].join('\n'))
      // Replace the map chunk outright: the shader still contains the
      // #include token at onBeforeCompile time, so a regex on the expanded
      // texture2D call would never match.
      .replace('#include <map_fragment>', [
        '#ifdef USE_MAP',
        '  vec4 sampledDiffuseColor = texture2D( map, vAffineUV / max( vAffineW, 0.0001 ) );',
        '  diffuseColor *= sampledDiffuseColor;',
        '#endif'
      ].join('\n'));
  };
  // Prevent Three.js from reusing an unpatched program for a patched material.
  material.customProgramCacheKey = function () { return 'psx_' + (opts.snap === false ? 'off' : 'on'); };
  return material;
}

// Convenience: make a texture that always uses nearest filtering.
function nearest(tex) {
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestMipmapNearestFilter;
  tex.generateMipmaps = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* =========================================================================
   2. PROCEDURAL PIXEL TEXTURES (canvas-drawn, no external files)
   ========================================================================= */
function canvasTexture(w, h, draw) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d');
  draw(ctx, w, h);
  return nearest(new THREE.CanvasTexture(c));
}

// Water: dark teal with warm orange glints, blocky 4px "pixels".
var waterTex = canvasTexture(64, 64, function (g, w, h) {
  g.fillStyle = '#275f63'; g.fillRect(0, 0, w, h);
  var rand = seededRandom(7);
  for (var i = 0; i < 110; i++) {
    var x = (rand() * w) | 0, y = (rand() * h) | 0;
    var s = 2 + ((rand() * 3) | 0) * 2;
    g.fillStyle = rand() < 0.2 ? '#e8a15c' :
                  (rand() < 0.5 ? '#4d9d97' : '#174851');
    g.fillRect(x, y, s, 2);
  }
});
// The game uses a second transparent sheet of warm/teal glints scrolling at a
// different angle. Reuse the exact recipe here so the cutscene and in-game
// water read as the same surface.
var waterGlintTex = canvasTexture(64, 64, function (g, w, h) {
  var rand = seededRandom(10);
  for (var i = 0; i < 42; i++) {
    var x = (rand() * w) | 0, y = (rand() * h) | 0;
    var s = 2 + ((rand() * 3) | 0) * 2;
    var warm = rand() < 0.2;
    g.fillStyle = warm ? '#e8a15c' : (rand() < 0.5 ? '#4d9d97' : '#174851');
    g.globalAlpha = warm ? 0.9 : 0.42;
    g.fillRect(x, y, s, 2);
  }
  g.globalAlpha = 1;
});
// Nearest with no mipmaps keeps the pixel strokes crisp when scaled to screen,
// matching the game's water renderer rather than the softer mipmapped version.
[waterTex, waterGlintTex].forEach(function (t) {
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
});
waterGlintTex.offset.set(0.37, 0.21);

// Corrugated tin roof: vertical alternating light/dark stripes.
var tinTex = canvasTexture(64, 64, function (g, w, h) {
  for (var x = 0; x < w; x += 4) {
    g.fillStyle = (x % 8 === 0) ? '#8e9294' : '#666c70';
    g.fillRect(x, 0, 4, h);
  }
  var rand = seededRandom(11);
  for (var i = 0; i < 30; i++) {
    g.fillStyle = 'rgba(120,70,40,0.25)';
    g.fillRect((rand() * w) | 0, (rand() * h) | 0, 2 + ((rand()*4)|0), 2);
  }
});

// Weathered wood planks for pier/dock/fish house walls.
var woodTex = canvasTexture(64, 64, function (g, w, h) {
  g.fillStyle = '#6d5138'; g.fillRect(0, 0, w, h);
  var rand = seededRandom(23);
  for (var y = 0; y < h; y += 8) {
    g.fillStyle = (y % 16 === 0) ? '#5a402c' : '#7a5a3d';
    g.fillRect(0, y, w, 7);
    for (var i = 0; i < 8; i++) {
      g.fillStyle = 'rgba(30,20,12,0.35)';
      g.fillRect((rand() * w) | 0, y + 1 + ((rand()*5)|0), 1 + ((rand()*6)|0), 1);
    }
  }
});

// Glowing window atlas: warm yellow-orange pixel grid.
var windowTex = canvasTexture(32, 32, function (g, w, h) {
  g.fillStyle = '#3a2410'; g.fillRect(0, 0, w, h);
  for (var y = 2; y < h; y += 8) for (var x = 2; x < w; x += 8) {
    g.fillStyle = ((x + y) % 16 === 4) ? '#ffcf72' : '#f39c3c';
    g.fillRect(x, y, 6, 6);
  }
});

// TheBeacon Seafood sign — text baked to a pixel-art canvas.
var signTex = canvasTexture(256, 64, function (g, w, h) {
  g.fillStyle = '#4a3a26'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#2a1f14'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
  g.fillStyle = '#f4d38a';
  g.font = 'bold 30px "Courier New", monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('BEACON SEAFOOD', w / 2, h / 2 + 2);
  // Chip a few pixels for that weathered look.
  var rand = seededRandom(41);
  for (var i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(74,58,38,0.8)';
    g.fillRect((rand()*w)|0, (rand()*h)|0, 2 + ((rand()*4)|0), 2);
  }
});

// Small deterministic RNG so the scene is identical on every replay.
function seededRandom(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

/* =========================================================================
   3. SCENE, FOG, LIGHTING, SKY DOME
   ========================================================================= */
var scene = new THREE.Scene();
// Warm amber fog: short draw distance = PS1 pop-in. Lighter than the old
// sunset grade because the sun is still well above the horizon here.
scene.fog = new THREE.Fog(0xe8ad72, 30, 165);

var camera = new THREE.PerspectiveCamera(62, W / H, 0.5, 600);
camera.position.set(0, 2, -120);

// Just before sunset: higher, brighter sun, warm but not yet twilight.
scene.add(new THREE.AmbientLight(0xffd9b6, 0.78));
var sun = new THREE.DirectionalLight(0xffd39a, 1.25);
sun.position.set(-75, 75, -55);
scene.add(sun);
var fill = new THREE.DirectionalLight(0x8a6fb8, 0.28);
fill.position.set(50, 28, 60);
scene.add(fill);

// Low-poly gradient sky dome: blue-violet zenith fading through rosy pink
// into golden amber at the horizon. Vertex colours keep it faceted.
(function buildSky() {
  var geo = new THREE.IcosahedronGeometry(320, 3);
  var pos = geo.attributes.position;
  var colors = [];
  var zenith = new THREE.Color(0x3b2b70);
  var mid    = new THREE.Color(0xa9557d);
  var horizon= new THREE.Color(0xe98b52);
  var horizonB= new THREE.Color(0xffc178);
  for (var i = 0; i < pos.count; i++) {
    var y = pos.getY(i) / 320;
    var c;
    if (y > 0.25) c = zenith.clone().lerp(mid, (1 - y) / 0.75);
    else if (y > 0) c = mid.clone().lerp(horizon, 1 - y / 0.25);
    else c = horizon.clone().lerp(horizonB, Math.min(1, -y * 3));
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  var mat = patchPSX(new THREE.MeshBasicMaterial({
    vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false
  }), { snap: false });
  var dome = new THREE.Mesh(geo, mat);
  dome.renderOrder = -100;
  scene.add(dome);
})();

/* =========================================================================
   4. MATERIAL FACTORY — every material goes through the PSX patch
   ========================================================================= */
function lambert(color, opts) {
  opts = opts || {};
  var m = new THREE.MeshLambertMaterial({
    color: color,
    map: opts.map || null,
    flatShading: true,
    fog: true,
    emissive: opts.emissive || 0x000000
  });
  if (opts.transparent) { m.transparent = true; m.opacity = opts.opacity; }
  if (opts.side) m.side = opts.side;
  return patchPSX(m, opts);
}
function basic(color, opts) {
  opts = opts || {};
  var m = new THREE.MeshBasicMaterial({
    color: color, map: opts.map || null,
    fog: opts.fog == null ? true : opts.fog,
    side: opts.side || THREE.FrontSide
  });
  return patchPSX(m, opts);
}

function box(w, h, d, material, x, y, z, parent) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  (parent || scene).add(m);
  return m;
}

/* =========================================================================
   5. WATER — tessellated plane, scrolling UV, vertex wave displacement
   ========================================================================= */
var waterGeo = new THREE.PlaneGeometry(420, 420, 52, 52);
waterGeo.rotateX(-Math.PI / 2);
var waterBase = waterGeo.attributes.position.array.slice();
var waterMat = lambert(0xffffff, { map: waterTex, emissive: 0x2e2113 });
var water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = 0;
scene.add(water);

var waterGlintMat = lambert(0xffffff, {
  map: waterGlintTex, emissive: 0x2e2113,
  transparent: true, opacity: 0.62
});
waterGlintMat.depthWrite = false;
var waterGlints = new THREE.Mesh(waterGeo, waterGlintMat);
waterGlints.position.y = 0.08;
scene.add(waterGlints);

/* =========================================================================
   6. LAND BANK + BEACON SEAFOOD FISH HOUSE
   -------------------------------------------------------------------------
   Water fills the channel toward -Z. A raised shore sits on the +Z side of
   the dock, with the fish house and parking lot on it.
   ========================================================================= */
var harbor = new THREE.Group();
harbor.position.set(0, 0, 0);
scene.add(harbor);

var LAND_TOP = 0.6;
var landMat  = lambert(0x6c7650);
var sandMat  = lambert(0xa89670, { map: woodTex });
var asphaltMat = lambert(0x3b3d3e);

// Main shore slab: z = 8..90, top at LAND_TOP. The channel stays water.
box(180, 1.0, 82, landMat, 0, 0.1, 49, harbor);
// Sandy lip right at the waterline.
box(180, 0.7, 4, sandMat, 0, 0.25, 9, harbor);

// The fish house sits on the bank. Its old piling-based local coordinates are
// preserved inside this subgroup, shifted down so the walls start at LAND_TOP.
var fishHouse = new THREE.Group();
fishHouse.position.set(0, LAND_TOP - 4.4, 14);
harbor.add(fishHouse);

var wallMat  = lambert(0xb08a60, { map: woodTex });
var darkWood = lambert(0x6d5138, { map: woodTex });
var tinMat   = lambert(0xc0c4c6, { map: tinTex });
var glowMat  = basic(0xffc25a, { map: windowTex, fog: true });
var rustMat  = lambert(0x8a5236);
var metalMat = lambert(0x5b6166);

// Main building volume, now resting on the shore slab.
box(18, 6, 8, wallMat, 0, 7.4, 0, fishHouse);
// Corrugated tin gable roof — two slanted slabs.
var roofL = box(10.2, 0.35, 9, tinMat, -4.6, 11.2, 0, fishHouse);
roofL.rotation.z = 0.36;
var roofR = box(10.2, 0.35, 9, tinMat, 4.6, 11.2, 0, fishHouse);
roofR.rotation.z = -0.36;
// Gable end triangle.
[4.02, -4.02].forEach(function (z) {
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
    -9, 10.4, z,  9, 10.4, z,  0, 13.1, z
  ], 3));
  g.computeVertexNormals();
  fishHouse.add(new THREE.Mesh(g, wallMat));
});

// Chunky plank seams, corner posts and roof trim break up the flat building
// shell. These are wide, dark strips so they survive the 320x240 framebuffer.
for (var sy = 4.9; sy < 10.3; sy += 0.85) {
  box(18.1, 0.09, 0.07, darkWood, 0, sy,  4.06, fishHouse);
  box(18.1, 0.09, 0.07, darkWood, 0, sy, -4.06, fishHouse);
}
[-9.05, 9.05].forEach(function (x) {
  [-4.1, 4.1].forEach(function (z) {
    box(0.36, 6.2, 0.36, darkWood, x, 7.4, z, fishHouse);
  });
  box(0.34, 0.24, 8.3, darkWood, x, 10.3, 0, fishHouse);
});
box(19, 0.36, 0.44, metalMat, 0, 13.0, 0, fishHouse);
box(19, 0.28, 0.3, darkWood, 0, 10.6, -4.2, fishHouse);
box(19, 0.28, 0.3, darkWood, 0, 10.6,  4.2, fishHouse);

// Frame a glowing pane with dark timber and a single muntin. Frames are drawn
// as boxes rather than lines so nothing reads as a wireframe at distance.
function frameWindow(x, y, z, alongX) {
  var w = alongX ? 2.9 : 0.22, d = alongX ? 0.22 : 2.9;
  box(w, 0.16, d, darkWood, x, y + 1.2, z, fishHouse);
  box(w, 0.16, d, darkWood, x, y - 1.2, z, fishHouse);
  box(0.16, 2.5, 0.18, darkWood,
    x - (alongX ? 1.35 : 0), y, z - (alongX ? 0 : 1.35), fishHouse);
  box(0.16, 2.5, 0.18, darkWood,
    x + (alongX ? 1.35 : 0), y, z + (alongX ? 0 : 1.35), fishHouse);
  box(alongX ? 0.08 : 0.18, 2.2, alongX ? 0.18 : 0.08,
    darkWood, x, y, z, fishHouse);
}

// Approach face keeps a central roller door; the other three sides are all
// warm windows so the orbit never shows a blank wall.
[-5.7, 5.7].forEach(function (x) {
  box(2.5, 2.2, 0.16, glowMat, x, 7.6, -4.08, fishHouse);
  frameWindow(x, 7.6, -4.12, true);
});
[-5.7, -1.9, 1.9, 5.7].forEach(function (x) {
  box(2.5, 2.2, 0.16, glowMat, x, 7.6, 4.08, fishHouse);
  frameWindow(x, 7.6, 4.12, true);
});
[-2.4, 2.4].forEach(function (z) {
  box(0.16, 2.2, 2.5, glowMat,  9.08, 7.6, z, fishHouse);
  box(0.16, 2.2, 2.5, glowMat, -9.08, 7.6, z, fishHouse);
  frameWindow( 9.12, 7.6, z, false);
  frameWindow(-9.12, 7.6, z, false);
});

// Roller door, transom light and a small corrugated awning on the channel face.
box(4.6, 3.7, 0.2, darkWood, 0, 6.3, -4.12, fishHouse);
for (var dy = 0; dy < 9; dy++) {
  box(4.3, 0.1, 0.24, metalMat, 0, 4.7 + dy * 0.38, -4.26, fishHouse);
}
box(4.2, 0.7, 0.18, glowMat, 0, 8.45, -4.13, fishHouse);
var awning = box(6.4, 0.22, 2.6, tinMat, 0, 9.15, -5.2, fishHouse);
awning.rotation.x = 0.3;
box(6.4, 0.16, 0.2, darkWood, 0, 8.72, -6.35, fishHouse);
[-2.8, 2.8].forEach(function (x) {
  box(0.16, 1.7, 0.16, metalMat, x, 8.25, -5.8, fishHouse);
  var lamp = new THREE.Mesh(new THREE.SphereGeometry(0.28, 6, 4),
    basic(0xffd98a, { fog: true }));
  lamp.position.set(x, 7.35, -5.8);
  fishHouse.add(lamp);
});

// Wooden sign on both gables (-Z faces the opening approach shot).
[4.2, -4.2].forEach(function (z, i) {
  var sign = new THREE.Mesh(new THREE.PlaneGeometry(11, 2.7),
    basic(0xffffff, { map: signTex }));
  sign.position.set(0, 10.2, z);
  if (i === 1) sign.rotation.y = Math.PI;
  fishHouse.add(sign);
});

// Stacked crab pots and rusted barrels beside the shop door, on the bank.
var potMat = lambert(0x6b6a52);
var propRand = seededRandom(57);
[[-12, 4.75, -2], [-12, 4.75, 0], [-12, 4.75, 2],
 [-12, 5.55, -1], [-12, 5.55, 1], [12, 4.75, -2], [12, 4.75, 0]].forEach(function (p) {
  var pot = box(1.6, 0.7, 1.4, potMat, p[0], p[1], p[2], fishHouse);
  pot.rotation.y = (propRand() - 0.5) * 0.3;
});

[[ -11.5, 5.15, 5.5 ], [ -9.8, 5.15, 5.8 ], [ 11.6, 5.15, 5.3 ]].forEach(function (p) {
  var barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 1.5, 7), rustMat);
  barrel.position.set(p[0], p[1], p[2]);
  fishHouse.add(barrel);
});

// Stacked fish crates and rope coils make the wharf read as a working dock.
var crateMat = lambert(0xb08a5c, { map: woodTex });
var crateRand = seededRandom(83);
[[-13.4, 4.85, -1.2], [-13.2, 5.45, -1.4], [13.2, 4.85, 1.1],
 [13.4, 5.45, 0.9], [-2.2, 4.75, 6.4], [2.6, 4.75, 6.6]].forEach(function (p) {
  var crate = box(1.5, 0.8, 1.2, crateMat, p[0], p[1], p[2], fishHouse);
  crate.rotation.y = (crateRand() - 0.5) * 0.35;
  box(1.55, 0.09, 0.09, darkWood, p[0], p[1] + 0.42, p[2], fishHouse);
});
[[-14.8, 4.72, 2.4], [14.6, 4.72, -2.6]].forEach(function (p) {
  var coil = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.16, 4, 9), darkWood);
  coil.rotation.x = Math.PI / 2;
  coil.position.set(p[0], p[1], p[2]);
  fishHouse.add(coil);
});

// A smaller ice shed on the bank gives the orbit a second lit structure.
(function buildIceShed() {
  var shed = new THREE.Group();
  shed.position.set(29, LAND_TOP, 16);
  harbor.add(shed);
  box(11, 4.2, 8, wallMat, 0, 2.1, 0, shed);
  box(7.2, 0.28, 8.8, tinMat, -2.6, 4.5, 0, shed).rotation.z = 0.38;

/* =========================================================================
   11. CAMERA CHOREOGRAPHY — one continuous CatmullRomCurve3, three acts
   ========================================================================= */
// Act boundaries as fractions of the 16-second clip.
var ACT1 = 5.0 / CLIP_DURATION;    // 0.3125
var ACT2 = 11.5 / CLIP_DURATION;   // 0.71875

// Build the position path. Points are dense where the camera turns hard so
// the spline stays smooth through the 270-degree orbit.
var camPoints = [];
// --- Act 1: low, fast run down the channel toward the fish house ----------
camPoints.push(new THREE.Vector3(  0, 1.8, -118));
camPoints.push(new THREE.Vector3(  0, 1.7,  -90));
camPoints.push(new THREE.Vector3( -1, 1.6,  -62));
camPoints.push(new THREE.Vector3( -2, 2.0,  -38));
camPoints.push(new THREE.Vector3( -3, 2.8,  -18));
// --- Act 2: bank into a sweeping 270-degree orbit around the house --------
var orbitCX = 0, orbitCZ = 10, orbitR = 36, orbitY = 13;
// Start of orbit roughly at angle PI (behind the house, -X side).
for (var i = 0; i <= 12; i++) {
  var a = Math.PI + (i / 12) * Math.PI * 1.5; // 270 degrees
  camPoints.push(new THREE.Vector3(
    orbitCX + Math.cos(a) * orbitR,
    orbitY + Math.sin(i * 0.6) * 1.5,
    orbitCZ + Math.sin(a) * orbitR
  ));
}
// --- Act 3: pitch up, clear the roof, accelerate into the sunset ----------
camPoints.push(new THREE.Vector3(  0, 24,  34));
camPoints.push(new THREE.Vector3(  0, 55,  38));
camPoints.push(new THREE.Vector3(  0, 100, 42));
camPoints.push(new THREE.Vector3(  0, 170, 46));
camPoints.push(new THREE.Vector3(  0, 260, 50));

var camCurve = new THREE.CatmullRomCurve3(camPoints, false, 'catmullrom', 0.35);

/* getPointAt() walks the curve by arc length, not by authored point index.
   The long ascent would otherwise swallow most of act 1. Measure the arc
   length at the two act boundaries and map time onto those u values, so the
   approach ends at 5.0s and the orbit ends at 11.5s while the whole path
   remains one continuous spline. */
var CURVE_DIVISIONS = 600;
var curveLengths = camCurve.getLengths(CURVE_DIVISIONS);
var curveTotal = curveLengths[CURVE_DIVISIONS];
function uAtIndex(index) {
  var t = index / (camPoints.length - 1);
  var at = t * CURVE_DIVISIONS;
  var i = Math.floor(at), f = at - i;
  var len = curveLengths[i] +
    (curveLengths[Math.min(i + 1, CURVE_DIVISIONS)] - curveLengths[i]) * f;
  return len / curveTotal;
}
var uAct1 = uAtIndex(4);   // last low-channel approach point
var uAct2 = uAtIndex(17);  // last 270-degree orbit point

function timeToCurveU(tNorm) {
  if (tNorm <= ACT1) return (tNorm / ACT1) * uAct1;
  if (tNorm <= ACT2) return uAct1 + ((tNorm - ACT1) / (ACT2 - ACT1)) * (uAct2 - uAct1);
  return uAct2 + ((tNorm - ACT2) / (1 - ACT2)) * (1 - uAct2);
}

// Look-at targets: fish house during acts 1-2, blending to straight-up in act 3.
var lookHouse = new THREE.Vector3(0, 6, 12);
var lookSky = new THREE.Vector3(0, 220, 46);
var lookTmp = new THREE.Vector3();

/* =========================================================================
   12. POST-PROCESSING — Bayer 4x4 ordered dithering + 15-bit RGB quantisation
   ========================================================================= */
var rt = new THREE.WebGLRenderTarget(W, H, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  depthBuffer: true,
  stencilBuffer: false
});
rt.texture.colorSpace = THREE.SRGBColorSpace;

var postScene = new THREE.Scene();
var postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
var postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: rt.texture },
    uResolution: { value: new THREE.Vector2(W, H) }
  },
  vertexShader: [
    'varying vec2 vUv;',
    'void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
  ].join('\n'),
  fragmentShader: [
    'precision mediump float;',
    'uniform sampler2D tDiffuse;',
    'uniform vec2 uResolution;',
    'varying vec2 vUv;',
    '/* 4x4 ordered Bayer threshold matrix, normalised to [-0.5, 0.5]. */',
    'float bayer4(vec2 p) {',
    '  int x = int(mod(p.x, 4.0));',
    '  int y = int(mod(p.y, 4.0));',
    '  int index = x + y * 4;',
    '  float m = 0.0;',
    '  if (index == 0) m =  0.0; else if (index == 1) m =  8.0;',
    '  else if (index == 2) m =  2.0; else if (index == 3) m = 10.0;',
    '  else if (index == 4) m = 12.0; else if (index == 5) m =  4.0;',
    '  else if (index == 6) m = 14.0; else if (index == 7) m =  6.0;',
    '  else if (index == 8) m =  3.0; else if (index == 9) m = 11.0;',
    '  else if (index == 10) m = 1.0; else if (index == 11) m = 9.0;',
    '  else if (index == 12) m =15.0; else if (index == 13) m = 7.0;',
    '  else if (index == 14) m =13.0; else m = 5.0;',
    '  return (m + 0.5) / 16.0 - 0.5;',
    '}',
    'void main() {',
    '  vec3 c = texture2D(tDiffuse, vUv).rgb;',
    '  float d = bayer4(floor(vUv * uResolution));',
    '  c += d * (1.0 / 31.0);',           // dither amplitude ~ one 5-bit step
    '  /* 15-bit colour: 5 bits per channel (PS1 True Colour is 15/16-bit). */',
    '  c = floor(clamp(c, 0.0, 1.0) * 31.0 + 0.5) / 31.0;',
    '  gl_FragColor = vec4(c, 1.0);',
    // The render target is sampled in linear space; encode back to sRGB for
    // the visible canvas, otherwise the whole cutscene renders nearly black.
    '  #include <colorspace_fragment>',
    '}'
  ].join('\n'),
  depthTest: false,
  depthWrite: false
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

/* =========================================================================
   13. MAIN LOOP — delta-time driven, 16 seconds, then hold the title card
   ========================================================================= */
/* =========================================================================
    12b. FPV GOGGLE TELEMETRY — same language as the game's Night Wasp HUD:
    artificial horizon, game-map coordinates, SAT/ALT/SPD, phone battery icon
    (green -> red), ACRO mode and the one-shot "battery low" dialog.
    ========================================================================= */
var hudPrevPos = camera.position.clone();
var hudSpeed = 0;
var batteryLowShown = false;
var hudMessageUntil = 0;
var hudDir = new THREE.Vector3();
var hudHome = new THREE.Vector3(0, LAND_TOP, 12);

function fpvCoord(v, neg, pos) {
  var digits = String(Math.min(999999, Math.round(Math.abs(v) * 10)));
  while (digits.length < 6) digits = '0' + digits;
  return digits + (v < 0 ? neg : pos);
}
function wrapAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function drawFpvHud(t, dt) {
  var g = hudCtx, w = W, h = H, cx = w / 2, cy = h / 2;
  g.clearRect(0, 0, w, h);

  var moved = camera.position.distanceTo(hudPrevPos);
  hudPrevPos.copy(camera.position);
  var instant = dt > 0 ? moved / dt : 0;
  hudSpeed += (instant - hudSpeed) * Math.min(1, dt * 4);

  camera.getWorldDirection(hudDir);
  var pitch = Math.max(-1.3, Math.min(1.3, Math.asin(
    Math.max(-1, Math.min(1, hudDir.y)))));
  var roll = Math.max(-1.2, Math.min(1.2, Math.atan2(camera.up.x, camera.up.y)));
  var horizonY = pitch * h * 0.4;
  var far = w * 1.6;

  // Artificial horizon ball: blue sky, brown ground, pitch ladder and roll arc.
  g.save();
  g.translate(cx, cy);
  g.rotate(-roll);
  g.beginPath(); g.rect(-far, -far, far * 2, far * 2); g.clip();
  g.fillStyle = 'rgba(18, 86, 140, 0.62)';
  g.fillRect(-far, -far, far * 2, horizonY + far);
  g.fillStyle = 'rgba(140, 96, 42, 0.68)';
  g.fillRect(-far, horizonY, far * 2, far * 2);
  g.strokeStyle = 'rgba(232, 255, 244, 0.95)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(-far, horizonY); g.lineTo(far, horizonY); g.stroke();

  g.font = 'bold 6px "Courier New", monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (var deg = -60; deg <= 60; deg += 10) {
    if (!deg) continue;
    var ly = horizonY - (deg * Math.PI / 180) * (h * 0.3);
    if (Math.abs(ly) > h * 0.75) continue;
    var half = deg % 20 === 0 ? 30 : 17;
    g.strokeStyle = 'rgba(232, 255, 244, 0.72)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(-half, ly); g.lineTo(half, ly); g.stroke();
    var label = String(Math.abs(deg));
    g.strokeStyle = 'rgba(3, 12, 17, 0.9)'; g.lineWidth = 2;
    g.strokeText(label, -half - 8, ly); g.strokeText(label, half + 8, ly);
    g.fillStyle = 'rgba(238, 255, 246, 0.95)';
    g.fillText(label, -half - 8, ly); g.fillText(label, half + 8, ly);
  }
  g.strokeStyle = 'rgba(232, 255, 244, 0.58)';
  g.beginPath(); g.arc(0, 0, h * 0.26, -Math.PI * 0.78, -Math.PI * 0.22); g.stroke();
  g.restore();

  // Fixed aircraft symbol, yellow roll pointer and goggles reticle.
  g.save();
  g.translate(cx, cy);
  g.strokeStyle = '#ffd166'; g.lineWidth = 1.5; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(-22, 0); g.lineTo(-7, 0);
  g.moveTo(7, 0); g.lineTo(22, 0);
  g.moveTo(0, -5); g.lineTo(0, 5);
  g.stroke();
  g.fillStyle = '#ffd166';
  g.beginPath();
  g.moveTo(0, -h * 0.26 - 5);
  g.lineTo(-4, -h * 0.26 - 12);
  g.lineTo(4, -h * 0.26 - 12);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(175, 255, 212, 0.85)'; g.lineWidth = 1;
  g.beginPath();
  g.moveTo(0, cy); g.lineTo(cx - 20, cy);
  g.moveTo(cx + 20, cy); g.lineTo(w, cy);
  g.moveTo(cx, 0); g.lineTo(cx, cy - 20);
  g.moveTo(cx, cy + 20); g.lineTo(cx, h);
  g.stroke();
  g.strokeStyle = '#ffd166'; g.lineWidth = 1;
  g.beginPath(); g.arc(cx, cy, 6, 0, Math.PI * 2); g.stroke();
  g.restore();

  // Game-map coordinates: exactly six zero-padded digits per axis, N/S and
  // E/W derived from the game's +X east, -Z north convention.
  g.font = 'bold 7px "Courier New", monospace';
  g.textAlign = 'left'; g.textBaseline = 'top';
  g.fillStyle = 'rgba(255, 236, 190, 0.95)';
  g.fillText('LAT ' + fpvCoord(camera.position.z, 'N', 'S') +
    '  LON ' + fpvCoord(camera.position.x, 'W', 'E'), 4, 5);

  var heading = Math.atan2(hudDir.x, hudDir.z);
  var hx = hudHome.x - camera.position.x, hz = hudHome.z - camera.position.z;
  var homeDist = Math.sqrt(hx * hx + hz * hz);
  var bearing = Math.atan2(hx, hz);
  var homeDeg = Math.round(((bearing * 180 / Math.PI) + 360) % 360);
  g.textAlign = 'right';
  g.fillText('HOME ' + String(homeDeg).padStart(3, '0') + '° ' +
    Math.round(homeDist) + 'm', w - 4, 15);
  g.save();
  g.translate(w - 12, 8);
  g.rotate(wrapAngle(bearing - heading));
  g.fillStyle = '#ffd166';
  g.beginPath(); g.moveTo(0, -3); g.lineTo(2.5, 2); g.lineTo(-2.5, 2); g.closePath(); g.fill();
  g.restore();

  g.textAlign = 'left';
  g.fillStyle = 'rgba(232, 255, 244, 0.9)';
  g.fillText('12 SAT', 4, 27);
  g.fillText('ALT ' + Math.max(0, Math.round(camera.position.y - LAND_TOP)) + ' m', 4, 37);
  g.fillText('SPD ' + Math.round(hudSpeed * 3.6) + ' km/h', 4, 47);

  var act = t < 5 ? 'APPROACH' : (t < 11.5 ? 'ORBIT' : 'ASCENT');
  g.textAlign = 'center';
  g.fillStyle = 'rgba(255, 209, 102, 0.9)';
  g.fillText(t >= 12.4 ? 'RTH' : 'CAM 0' + (t < 5 ? 1 : t < 11.5 ? 2 : 3) +
    '/03 · ' + act, cx, 5);

  var pct = Math.max(0, 34 - (t / CLIP_DURATION) * 16);
  var voltage = 14 + (pct / 100) * 2.8;
  var seconds = Math.round((pct / 100) * 900);
  var mm = Math.floor(seconds / 60);
  var ss = String(seconds % 60).padStart(2, '0');
  var color = 'hsl(' + Math.round(pct * 1.2) + ', 92%, 55%)';
  g.fillStyle = 'rgba(255, 236, 190, 0.95)';
  g.fillText('HARBOR CAM', cx, h - 27);

  var bx = cx - 24, by = h - 13, bw = 22, bh = 7;
  g.strokeStyle = color; g.lineWidth = 1;
  g.strokeRect(bx, by, bw, bh);
  g.fillStyle = color;
  g.fillRect(bx + 1, by + 1, Math.max(0, (bw - 2) * pct / 100), bh - 2);
  g.fillRect(bx + bw + 1, by + 2, 2, 3);
  g.textAlign = 'left';
  g.fillText(voltage.toFixed(1) + ' V · ' + mm + ':' + ss, bx + bw + 6, by - 1);
  g.textAlign = 'right';
  g.fillStyle = color;
  g.fillText('ACRO', w - 4, by - 1);

  if (pct <= 20 && !batteryLowShown) {
    batteryLowShown = true;
    hudMessageUntil = t + 3.4;
  }
  if (t < hudMessageUntil) {
    var boxW = 74, boxH = 17, dx = cx - boxW / 2, dy = cy + 30;
    g.fillStyle = 'rgba(12, 6, 14, 0.88)';
    g.fillRect(dx, dy, boxW, boxH);
    g.strokeStyle = '#ffd166';
    g.strokeRect(dx, dy, boxW, boxH);
    g.textAlign = 'center';
    g.fillStyle = '#ffe7a8';
    g.font = 'bold 8px "Courier New", monospace';
    g.fillText('battery low', cx, dy + 4);
  }
}

var clock = new THREE.Clock();
var elapsed = 0;
var finished = false;
var replayRequested = false;

function updateWater(t) {
  // Scroll the pixel texture and displace vertices with two crossing waves.
  waterTex.offset.x = t * 0.012;
  waterTex.offset.y = t * 0.007;
  waterGlintTex.offset.x = 0.37 - t * 0.024;
  waterGlintTex.offset.y = 0.21 + t * 0.018;
  var p = waterGeo.attributes.position.array;
  for (var i = 0; i < p.length; i += 3) {
    var x = waterBase[i], z = waterBase[i + 2];
    p[i + 1] = Math.sin(x * 0.16 + t * 1.7) * 0.18 +
               Math.sin(z * 0.11 - t * 1.1) * 0.13;
  }
  waterGeo.attributes.position.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

function updateGulls(t, dt) {
  for (var i = 0; i < gulls.length; i++) {
    var g = gulls[i];
    var a = t * g.speed + g.phase;
    // Erratic circling: combine the base orbit with a slower wobble.
    var r = g.radius + Math.sin(a * 2.3 + g.erratic) * 3.5;
    g.group.position.set(
      Math.cos(a) * r,
      g.height + Math.sin(a * 1.7 + g.erratic) * g.bob,
      8 + Math.sin(a) * r
    );
    g.group.rotation.y = -a + Math.PI / 2;
    // Flap the two-triangle wings.
    var flap = Math.sin(t * (7 + g.bob) + g.phase) * 0.85;
    g.left.rotation.z = flap;
    g.right.rotation.z = -flap;
  }
}

function updateCamera(tNorm) {
  var pos = camCurve.getPointAt(timeToCurveU(Math.min(1, Math.max(0, tNorm))));
  camera.position.copy(pos);

  // Look target: hold on the fish house through act 2, then blend upward.
  var upBlend = 0;
  if (tNorm > ACT2) {
    upBlend = (tNorm - ACT2) / (1 - ACT2);
    upBlend = upBlend * upBlend * (3 - 2 * upBlend); // smoothstep
  }
  lookTmp.copy(lookHouse).lerp(lookSky, upBlend);

  // Bank the camera during the orbit for a sense of speed.
  var bank = 0;
  if (tNorm > ACT1 && tNorm < ACT2) {
    var p = (tNorm - ACT1) / (ACT2 - ACT1);
    bank = Math.sin(p * Math.PI) * 0.22;
  }
  camera.up.set(Math.sin(bank), Math.cos(bank), 0);
  camera.lookAt(lookTmp);
}

function updateTitle(t) {
  // Fade in only during the final act (11.5s - 16s), slow and cinematic.
  var start = 12.4, end = 15.6;
  var a = (t - start) / (end - start);
  a = Math.min(1, Math.max(0, a));
  a = a * a * (3 - 2 * a);
  titleEl.style.opacity = String(a);
}

function frame() {
  requestAnimationFrame(frame);
  var dt = Math.min(clock.getDelta(), 0.1);

  if (!finished) {
    elapsed += dt;
    if (elapsed >= CLIP_DURATION) { elapsed = CLIP_DURATION; finished = true; }
    var tn = elapsed / CLIP_DURATION;
    updateCamera(tn);
    updateTitle(elapsed);
  } else if (replayRequested) {
    replayRequested = false;
    elapsed = 0;
    finished = false;
    clock.getDelta();
    titleEl.style.opacity = '0';
  }

  var t = elapsed;
  updateWater(t);
  updateGulls(t, dt);

  // Pass 1: full scene into the low-res render target.
  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(scene, camera);
  // Pass 2: dither + quantise into the visible 320x240 canvas.
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
  // Pass 3: FPV goggles are a camera overlay, so they stay crisp on top of the
  // quantized scene just like the HUD canvas does in the game.
  drawFpvHud(elapsed, dt);
}

/* Replay on any input. */
function replay() {
  replayRequested = true;
  batteryLowShown = false;
  hudMessageUntil = 0;
  hudSpeed = 0;
  hudPrevPos.copy(camera.position);
}
window.addEventListener('keydown', replay);
window.addEventListener('pointerdown', replay);

// Tiny read-only hook for smoke tests / debugging; harmless at runtime.
window.__harborIntro = {
  get elapsed() { return elapsed; },
  get finished() { return finished; },
  get camera() { return camera.position.toArray().map(function (v) { return +v.toFixed(2); }); },
  get batteryLow() { return batteryLowShown; },
  replay: replay
};

// Prime the camera at the first frame and start.
updateCamera(0);
frame();

})();
</script>
